[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsirius"
version = "0.1.0"
description = "Source-to-Cup-1 beam optimizer for FLAVIA"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
